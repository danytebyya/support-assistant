server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html demo.html;

    # Gzip сжатие для ускорения загрузки компонентов
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Раздача фронтенда и SPA fallback на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика виджета
    location /widget/ {
        alias /usr/share/nginx/html/widget/;
        try_files $uri $uri/ =404;
    }

    # Проксирование API backend запросов (/chat, /chat/stream, /health, /admin, /api)
    location ~ ^/(chat|health|admin|api)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключение буферизации для корректной работы Server-Sent Events (SSE) в /chat/stream
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Таймауты для работы LLM
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}
